name: Verificar laboratorio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run catalog:generate
      - run: git diff --exit-code -- data/catalog.json data/execution-coverage.json src/catalog.js docs/COVERAGE.md
      - run: npm run build
